version: 2

models:
  - name: customer
    description: "Customer DBT model"
  - name: customer_vw
    description: "DBT model for the customer view"    
  - name: employee
    description: "Employee DBT model"
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["1", "2", "3", "4", "5"]
              config:
                severity: warn
      - name: emp_salary
        data_tests:
          - value_check


sources:
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
      # could have more than one table name here for reference in the {{ source() }} code
